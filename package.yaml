name: notebook-language-server-core
version: 0.1.0.0
license: BSD-3-Clause

default-extensions:
- OverloadedStrings
- QuasiQuotes
- NamedFieldPuns
- RecordWildCards
- ScopedTypeVariables
- FlexibleContexts
- FlexibleInstances
- LambdaCase
- ViewPatterns
- MultiParamTypeClasses
- MultiWayIf
- TupleSections
- NumericUnderscores
- TypeApplications

ghc-options:
- -Wunused-packages
- -Wall
- -fno-warn-name-shadowing

library:
  source-dirs: src
  dependencies:
  - aeson
  - auto-update
  - base
  - containers
  - filepath
  - lens
  - lens-regex-pcre
  - lsp-types
  - monad-logger
  - mtl
  - myers-diff
  - network-uri
  - pcre-light
  - process
  - random
  - retry
  - safe
  - string-interpolate
  - text
  - text-rope
  - time
  - unliftio
  - unliftio-core
  - uuid

tests:
  notebook-language-server-core-test:
    main: Main.hs
    source-dirs:
    - test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -O2
    - -W
    build-tools: sandwich:sandwich-discover
    dependencies:
    - aeson
    - base >= 4.7 && < 5
    - containers
    - lsp-types >= 2.0.0.1
    - monad-logger
    - mtl
    - notebook-language-server-core
    - pcre-light
    - sandwich
    - text
    - text-rope
    - unliftio
    - uuid
